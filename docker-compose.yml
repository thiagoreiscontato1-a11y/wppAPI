services:
  chat:
    build: .
    restart: unless-stopped
    ports:
      - "${CHAT_PORT:-3000}:3000"
    environment:
      APP_USER: ${APP_USER:-admin}
      APP_PASSWORD: ${APP_PASSWORD:?Defina APP_PASSWORD no arquivo .env}
    volumes:
      - wwebjs-data:/data
    shm_size: "512mb"

  # HTTPS automático (Let's Encrypt). Ative com: docker compose --profile https up -d
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [chat]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  wwebjs-data:
  caddy-data:
