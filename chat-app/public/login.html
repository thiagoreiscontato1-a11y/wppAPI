<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10302a" />
  <title>Entrar | WPPAPI Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/theme.js"></script>
</head>
<body class="login-page">
  <main class="overlay">
    <form id="loginForm" class="connect-card login-card" novalidate>
      <span class="workspace-mark workspace-mark-lg" aria-hidden="true">W</span>
      <h2>Entrar no WPPAPI Chat</h2>
      <p>Use o usuário e a senha definidos em <code>APP_USER</code> e <code>APP_PASSWORD</code> no servidor.</p>
      <label class="login-field"><span>Usuário</span><input id="loginUser" name="user" autocomplete="username" autocapitalize="none" required autofocus /></label>
      <label class="login-field"><span>Senha</span><input id="loginPassword" name="password" type="password" autocomplete="current-password" required /></label>
      <div id="loginError" class="form-error hidden" role="alert"></div>
      <button id="loginSubmit" class="primary-button login-submit" type="submit">Entrar</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
