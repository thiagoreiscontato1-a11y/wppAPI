name: Upstream check

# Verifica toda semana se a whatsapp-web.js original tem mudanças na biblioteca que ainda
# não foram trazidas para cá, e abre (ou atualiza) uma issue com a lista.
on:
    schedule:
        - cron: '17 11 * * 1'
    workflow_dispatch:

permissions:
    contents: read
    issues: write

jobs:
    check:
        if: github.repository != 'wwebjs/whatsapp-web.js'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Compare with upstream
              id: compare
              run: |
                  set +e
                  bash tools/sync-upstream.sh --check > changes.txt 2>&1
                  code=$?
                  set -e
                  cat changes.txt
                  if [ "$code" -eq 10 ]; then echo "outdated=true" >> "$GITHUB_OUTPUT"; elif [ "$code" -ne 0 ]; then exit "$code"; fi

            - name: Open or update issue
              if: steps.compare.outputs.outdated == 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  title='Atualização da whatsapp-web.js disponível'
                  {
                      echo 'A whatsapp-web.js original tem mudanças na biblioteca que ainda não estão neste repositório:'
                      echo
                      echo '```'
                      cat changes.txt
                      echo '```'
                      echo
                      echo 'Para trazer as mudanças, rode `bash tools/sync-upstream.sh`, depois `npm install` e `npm --prefix chat-app test`, e faça o commit.'
                  } > body.md
                  number=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
                  if [ -n "$number" ]; then
                      gh issue edit "$number" --body-file body.md
                  else
                      gh issue create --title "$title" --body-file body.md
                  fi
